# DKMS description of the LL Privacy mask for net/bluetooth (bluetooth-disable-ll-privacy.patch).
# The bluetooth-disable-ll-privacy-dkms package installs this file, pre-build.sh and the patch as
# /usr/src/bluetooth-disable-ll-privacy-<version>/ (@PKGVER@ is filled in from the PKGBUILD). For each
# kernel, DKMS copies that into /var/lib/dkms/bluetooth-disable-ll-privacy/<version>/build/ and runs the
# steps below there. $kernelver, $kernel_source_dir and $dkms_tree come from DKMS.
PACKAGE_NAME="bluetooth-disable-ll-privacy"
PACKAGE_VERSION="@PKGVER@"

# Only the Arch "linux" kernel (x.y.z-archN-M): pre-build.sh takes the source from the
# archlinux/linux repository tag that matches the kernel being built for. Other kernels
# (linux-lts, ...) are skipped and keep the stock module.
BUILD_EXCLUSIVE_KERNEL="^[0-9]+\.[0-9]+(\.[0-9]+)?-arch[0-9]+-[0-9]+$"

# Fetch net/bluetooth for exactly that kernel into ./src and apply the patch.
PRE_BUILD="pre-build.sh ${kernelver}"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src/net/bluetooth modules"

BUILT_MODULE_NAME[0]="bluetooth"
BUILT_MODULE_LOCATION[0]="src/net/bluetooth/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
